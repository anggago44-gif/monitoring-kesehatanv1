<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#050b2e">

<title>Monitoring Kesehatan</title>

<link rel="stylesheet"
href="style.css?v=300">

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>

        <h1>
            MONITORING KESEHATAN
        </h1>

    </header>



    <!-- CARD SENSOR -->

    <section class="cards">

        <div class="card">

            <div>
                🌡 Suhu
            </div>

            <h2 id="temp">
                0°C
            </h2>

        </div>


        <div class="card">

            <div>
                🩸 SpO₂
            </div>

            <h2 id="spo2">
                0%
            </h2>

        </div>


        <div class="card">

            <div>
                ❤️ Heart Rate
            </div>

            <h2 id="hr">
                0 bpm
            </h2>

        </div>

    </section>




    <!-- GRID -->

    <section class="grid">


        <!-- CHART -->

        <div class="charts">


            <div class="chart-box">

                <div id="chartTemp"></div>

            </div>



            <div class="chart-box">

                <div id="chartSpo2"></div>

            </div>



            <div class="chart-box">

                <div id="chartHR"></div>

            </div>


        </div>




        <!-- GAUGE -->

        <aside class="gauges">


            <div class="chart-box">

                <div id="gauge1"></div>

            </div>



            <div class="chart-box">

                <div id="gauge2"></div>

            </div>



            <div class="chart-box">

                <div id="gauge3"></div>

            </div>

        </aside>

    </section>




    <!-- ECG -->

    <section
    class="chart-box"
    style="margin-top:20px">

        <div id="ecg"></div>

    </section>



    <!-- STATUS -->

    <section
    class="status"
    id="status">

        MENUNGGU...

    </section>

</div>


<script src="index.js?v=300"></script>

</body>
</html>
