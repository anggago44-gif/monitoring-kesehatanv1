<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Monitoring Kesehatan</title>

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<link rel="stylesheet"
href="style.css?v=999">

</head>

<body>

<div class="container">

<h1>
MONITORING KESEHATAN
</h1>


<!-- STANDBY -->

<div
id="standbyBox"
class="standby">

<h2>

⚠ BELUM ADA PASIEN AKTIF

</h2>

<p>

Silakan isi data pasien terlebih dahulu

</p>

<button onclick="
window.location='pasien.html'
">

📝 Pendaftaran Pasien

</button>

</div>




<!-- DASHBOARD -->

<div id="dashboardContent">



<div class="cards">


<div class="card">

🌡 Suhu

<h2 id="temp">
0°C
</h2>

</div>


<div class="card">

🩸 SpO₂

<h2 id="spo2">
0%
</h2>

</div>


<div class="card">

❤️ Heart Rate

<h2 id="hr">
0 bpm
</h2>

</div>


</div>



<div class="grid">


<div class="charts">


<div class="chart-box">

<div id="chartTemp">

</div>

</div>



<div class="chart-box">

<div id="chartSpo2">

</div>

</div>



<div class="chart-box">

<div id="chartHR">

</div>

</div>


</div>




<div class="gauges">

<div class="chart-box">

<div id="gauge1"></div>

</div>


<div class="chart-box">

<div id="gauge2"></div>

</div>


<div class="chart-box">

<div id="gauge3"></div>

</div>


</div>


</div>




<div
class="chart-box"
style="margin-top:20px">

<div id="ecg">

</div>

</div>




<div
class="status"
id="status">

MENUNGGU...

</div>


</div>

</div>

<script src="index.js?v=999"></script>

</body>
</html>
