<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050b2e">
    <title>Monitoring Kesehatan & Tensi IoT</title>
    
    <link rel="stylesheet" href="style.css?v=301">
    
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

<div class="container">

    <header>
        <h1>MONITORING KESEHATAN REAL-TIME</h1>
    </header>

    <section class="cards">
        <div class="card">
            <div>🌡 Suhu</div>
            <h2 id="temp">0°C</h2>
        </div>

        <div class="card">
            <div>🩸 SpO₂</div>
            <h2 id="spo2">0%</h2>
        </div>

        <div class="card">
            <div>❤️ Heart Rate</div>
            <h2 id="hr">0 bpm</h2>
        </div>

        <div class="card">
            <div>🩺 Tekanan Darah</div>
            <h2 id="bp">0/0 mmHg</h2>
        </div>
    </section>

    <section class="grid">

        <div class="charts">
            <div class="chart-box">
                <div id="chartTemp"></div>
            </div>
            <div class="chart-box">
                <div id="chartSpo2"></div>
            </div>
            <div class="chart-box">
                <div id="chartHR"></div>
            </div>
        </div>

        <aside class="gauges">
            <div class="chart-box">
                <div id="gauge1"></div>
            </div>
            <div class="chart-box">
                <div id="gauge2"></div>
            </div>
            <div class="chart-box">
                <div id="gauge3"></div>
            </div>
            <div class="chart-box">
                <div id="gauge4"></div>
            </div>
        </aside>

    </section>

    <section class="chart-box" style="margin-top:20px">
        <div id="chartTensi"></div>
    </section>

    <section class="chart-box" style="margin-top:20px">
        <div id="ecg"></div>
    </section>

    <section class="footer-section">
        <div class="control-box">
            <button id="btn-start" class="btn btn-start" onclick="sendControl('START')">START TENSI</button>
            <button id="btn-stop" class="btn btn-stop" onclick="sendControl('STOP')">EMERGENCY STOP</button>
        </div>
        
        <div class="status" id="status">
            MENUNGGU DATA...
        </div>
    </section>

</div>

<script src="index.js?v=301"></script>
</body>
</html>
