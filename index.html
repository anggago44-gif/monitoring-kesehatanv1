<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
name="theme-color"
content="#050b2e">

<title>Monitoring Kesehatan</title>

<link
rel="stylesheet"
href="style.css?v=300">

<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

</head>

<body>

<div class="container">

<h1>
MONITORING KESEHATAN
</h1>


<!-- CARD SENSOR -->

<div class="cards">


<div class="card">

<div>
🌡 Suhu
</div>

<h2 id="temp">
0°C
</h2>

</div>



<div class="card">

<div>
🩸 SpO₂
</div>

<h2 id="spo2">
0%
</h2>

</div>



<div class="card">

<div>
❤️ Heart Rate
</div>

<h2 id="hr">
0 bpm
</h2>

</div>


</div>



<!-- GRID TENGAH -->

<div class="grid">


<!-- CHART -->

<div class="charts">


<div class="chart-box">

<div id="chartTemp"></div>

</div>


<div class="chart-box">

<div id="chartSpo2"></div>

</div>


<div class="chart-box">

<div id="chartHR"></div>

</div>


</div>



<!-- GAUGE -->

<div class="gauges">


<div class="chart-box">

<div id="gauge1"></div>

</div>


<div class="chart-box">

<div id="gauge2"></div>

</div>


<div class="chart-box">

<div id="gauge3"></div>

</div>


</div>


</div>



<!-- ECG -->

<div
class="chart-box"
style="margin-top:20px;">

<div id="ecg"></div>

</div>



<!-- STATUS -->

<div
class="status"
id="status">

MENUNGGU...

</div>

</div>



<script src="index.js?v=300"></script>

</body>
</html>
